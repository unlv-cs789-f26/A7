<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Copilot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js"></script>
<style>
:root{--bg:#0e1420;--panel:#151d2c;--line:#24304a;--text:#dce4f2;--muted:#8796b0;--accent:#00cc99;--blue:#4f6df5;--warn:#f0a202;--bad:#e4572e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0b111b;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.3px}
header h1 span{color:var(--accent)}
header .sp{flex:1}
select,input,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button{cursor:pointer;background:var(--blue);border-color:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--text)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;height:calc(100vh - 53px)}
main{overflow:auto;padding:14px 18px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--muted)}
nav button.on{background:var(--panel);color:var(--text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:120px}
.card h3{margin:2px 4px 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.card.full{grid-column:1/-1}
.lock{color:var(--warn);font-size:11px;margin-left:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
.P1{background:var(--bad);color:#fff}.P2{background:var(--warn);color:#111}.P3{background:#4f8fd6;color:#fff}.P4{background:#55627a;color:#fff}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;background:#101827;min-height:0}
aside .top{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#msgs{flex:1;overflow:auto;padding:12px}
.m{margin:0 0 10px;padding:8px 10px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word}
.u{background:#1c2a44;margin-left:30px}
.b{background:var(--panel);border:1px solid var(--line);margin-right:12px}
.meta{font-size:11px;color:var(--muted);margin-top:4px}
form.ask{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
form.ask input{flex:1}
iframe{width:100%;height:580px;border:0;border-radius:8px;background:#fff}
.muted{color:var(--muted)}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}aside{height:70vh}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>SOC <span>Copilot</span></h1>
  <span class="muted" id="health"></span>
  <span class="sp"></span>
  <label class="muted">view as
    <select id="role"><option value="tier1">tier1 analyst</option><option value="manager">SOC manager</option></select>
  </label>
</header>
<div class="wrap">
  <main>
    <nav id="tabs"></nav>
    <div id="view" class="grid"></div>
  </main>
  <aside>
    <div class="top"><b>Ask the SOC Copilot</b><span class="sp" style="flex:1"></span>
      <select id="model"></select><button class="ghost" id="newchat" title="start a new conversation">new</button></div>
    <div id="msgs"><p class="muted">Ask about hosts, IPs, rules, ATT&amp;CK techniques or time windows in the alert
      history (Jan 21 - Jan 24 12:00 UTC, 2022). Your conversation is remembered.</p></div>
    <form class="ask" id="ask"><input id="q" placeholder="e.g. Who owns the host vpn?" autocomplete="off"><button>Send</button></form>
  </aside>
</div>
<script>
const $ = s => document.querySelector(s);
const roleSel = $("#role"), modelSel = $("#model");
let INFO = {panels: []}, TAB = "Overview";
let SESSION = "web-" + Math.random().toString(36).slice(2, 8);
try { roleSel.value = localStorage.getItem("soc6role") || "tier1"; } catch (e) {}
const LAYOUT = {paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", font: {color: "#dce4f2", size: 11},
  xaxis: {gridcolor: "#24304a"}, yaxis: {gridcolor: "#24304a"}};

async function j(url, opt) { const r = await fetch(url, opt); if (!r.ok) throw new Error(r.status + " " + await r.text()); return r.json(); }

async function load() {
  const role = roleSel.value;
  INFO = await j(`api/info?role=${role}`);
  modelSel.innerHTML = INFO.models.map(m => `<option>${m}</option>`).join("");
  const tabs = [...new Set(INFO.panels.map(p => p.tab).concat(["Cases", "Knowledge graph"]))];
  if (!tabs.includes(TAB)) TAB = tabs[0];
  $("#tabs").innerHTML = tabs.map(t => `<button class="${t === TAB ? "on" : ""}" data-t="${t}">${t}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { TAB = b.dataset.t; load(); });
  const h = await j("api/health");
  $("#health").textContent = `${h.panels} panels · KG ${h.kg ? "loaded" : "missing"} · triage ${h.triage ? "on" : "off"}`;
  render();
}

function render() {
  const role = roleSel.value, view = $("#view");
  view.innerHTML = "";
  if (TAB === "Knowledge graph") {
    view.innerHTML = `<div class="card full"><h3>Knowledge graph explorer</h3>
      <form id="kgf" style="display:flex;gap:6px;margin:4px"><input id="kgn" value="vpn" placeholder="node: host, IP, rule:31151, T1078, user">
      <select id="kgd"><option>1</option><option>2</option></select><button>Show</button></form>
      <iframe id="kgi" src="api/kg/view?node=vpn&depth=1&role=${role}"></iframe></div>`;
    $("#kgf").onsubmit = e => { e.preventDefault();
      $("#kgi").src = `api/kg/view?node=${encodeURIComponent($("#kgn").value)}&depth=${$("#kgd").value}&role=${role}`; };
    return;
  }
  if (TAB === "Cases") {
    const c = document.createElement("div"); c.className = "card full";
    c.innerHTML = "<h3>Case board (opened by n8n)</h3><div id='ctab' class='muted'>loading…</div>";
    view.appendChild(c);
    j("api/cases").then(rows => {
      $("#ctab").innerHTML = rows.length ? `<table><tr><th>#</th><th>prio</th><th>alert time</th><th>host</th><th>owner</th><th>reason</th><th>summary (n8n LLM)</th></tr>` +
        rows.slice().reverse().map(r => `<tr><td>${r.id}</td><td><span class="pill ${r.priority}">${r.priority}</span></td><td>${r.alert_ts || ""}</td>
        <td>${r.host || ""}</td><td>${r.owner || ""}</td><td>${esc(r.reason)}</td><td>${esc(r.summary)}</td></tr>`).join("") + "</table>"
        : "No cases yet - n8n opens them in A7 Part A.";
    }).catch(e => $("#ctab").textContent = e);
  }
  INFO.panels.filter(p => p.tab === TAB).forEach(p => {
    const c = document.createElement("div");
    c.className = "card" + (p.name === "kpis" ? " full" : "");
    c.innerHTML = `<h3>${p.title}${p.restricted ? '<span class="lock">manager only</span>' : ""}</h3><div class="plot muted">loading…</div>`;
    view.appendChild(c);
    j(`api/panels/${p.name}?role=${role}`).then(fig => {
      const div = c.querySelector(".plot"); div.textContent = "";
      const lay = Object.assign({}, fig.layout || {}, LAYOUT, {title: undefined});
      lay.xaxis = Object.assign({}, (fig.layout || {}).xaxis, LAYOUT.xaxis);
      lay.yaxis = Object.assign({}, (fig.layout || {}).yaxis, LAYOUT.yaxis);
      Plotly.newPlot(div, fig.data, lay, {displayModeBar: false, responsive: true});
    }).catch(e => c.querySelector(".plot").textContent = "panel error: " + e.message);
  });
}

function esc(s) { return String(s || "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }

function add(cls, text, meta) {
  const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
  $("#msgs").appendChild(d); $("#msgs").scrollTop = 1e9; return d;
}

$("#ask").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  $("#q").value = ""; add("u", q);
  const wait = add("b", "…");
  try {
    const r = await j("api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: q, model: modelSel.value, role: roleSel.value, session: SESSION + "-" + roleSel.value})});
    wait.remove();
    add("b", r.answer, `${modelSel.value} · ${r.prompt_tokens || 0} prompt tok · ${r.completion_tokens || 0} out · ${r.seconds}s`);
  } catch (err) { wait.textContent = "error: " + err.message; }
};
$("#newchat").onclick = () => { SESSION = "web-" + Math.random().toString(36).slice(2, 8); $("#msgs").innerHTML = ""; };
roleSel.onchange = () => { try { localStorage.setItem("soc6role", roleSel.value); } catch (e) {} load(); };
load().catch(e => $("#view").textContent = "Cannot reach the server: " + e.message);
</script>
</body>
</html>
